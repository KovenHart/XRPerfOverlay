; XR Perf Overlay - réglages.
; Ce fichier doit rester à côté de la DLL. Il est relu à chaque lancement de jeu.
; Les réglages faits en jeu avec les raccourcis (affichage, emplacement, taille, opacité) y sont enregistrés.
; La section [overlay] se règle aussi depuis XRPerfSensors (double-clic sur son icône près de l'horloge,
; ou clic droit puis "Ouvrir XR Perf Overlay") : les changements y sont appliqués tout de suite, même en cours de jeu.

[overlay]
; 1 = affiché au lancement, 0 = masqué (Ctrl+Alt+O pour basculer en jeu)
visible=1
; Emplacement : top-left, top, top-right, bottom-right, bottom, bottom-left (Ctrl+Alt+P pour changer en jeu)
position=bottom-left
; Distance du panneau devant les yeux, en mètres
distance=1.0
; Écart du centre du panneau par rapport à l'axe du regard, en mètres (à la distance ci-dessus).
; Si le panneau sort du champ de vision du casque, réduire ces deux valeurs.
offset_x=0.34
offset_y=0.26
; Largeur du panneau en mètres, de 0.10 à 1.50 (la hauteur suit).
; En jeu : Ctrl+Alt+Page précédente pour agrandir, Ctrl+Alt+Page suivante pour réduire.
width=0.36
; Opacité du fond seul, de 0 (transparent) à 1 (opaque). Le texte reste plein.
opacity=0.82
; Opacité de l'ensemble du panneau, texte compris, de 0.20 à 1.
; En jeu : Ctrl+Alt+Début pour plus opaque, Ctrl+Alt+Fin pour plus transparent.
global_opacity=1.00
; 1 = le panneau est tourné vers les yeux, 0 = il reste parallèle au plan de l'écran
face_viewer=1
; Panneau accroché à une manette : view = devant les yeux (réglages ci-dessus), left_hand = main gauche,
; right_hand = main droite. Le suivi des manettes est mis en place au lancement du jeu (voir [watch]).
anchor=view
; Sur la main : wrist_back = dos du poignet, wrist_inside = intérieur du poignet, above = au-dessus de la manette
hand_position=above
; 1 = sur la main, le panneau n'apparaît que quand on regarde sa main
gaze_only=0
; Ajustements de position sur la main, en mètres : le long de l'avant-bras (+ vers le coude), écart à la main (+ vers l'extérieur)
hand_along=0.00
hand_lift=0.00
; 1 = afficher l'heure en bas à droite du panneau, 0 = non
clock=1
; 1 = ajouter en bas du panneau une ligne avec le nom du casque et la résolution de rendu par œil
; (taille de l'image que le jeu envoie au casque pour un œil), 0 = non
headset_info=1
; Ligne "session / batterie" en bas du panneau (0 = sans, 1 = affiché) : temps écoulé depuis le
; lancement du jeu, et batterie des manettes quand le runtime la donne (SteamVR oui, Pimax OpenXR
; pas encore). Dans un jeu OpenXR, la batterie n'est demandée au runtime qu'au lancement du jeu.
session=0
battery=0
; Présentation du panneau :
;   classic = complète (tableau CPU / GPU, VRAM)
;   graph   = graphique (courbe du temps d'image des dix dernières secondes, CPU / GPU sur deux lignes)
;   compact = FPS seulement
layout=classic
; Couleurs : dark, light, contrast, green, amber, violet, ou custom (les trois couleurs ci-dessous,
; écrites #RRGGBB : fond, texte, accent).
theme=dark
custom_background=#0E1116
custom_text=#F0F3F8
custom_accent=#96BEF0
; Nom du casque à afficher. Vide = celui annoncé par le runtime OpenXR, qui n'est pas toujours le nom
; commercial (SteamVR, par exemple, donne le nom de son pilote). Sans accents, 47 caractères au plus.
; Exemple : headset_name=Pimax Crystal Light
headset_name=

; Langue du panneau, de la montre et des rapports : auto (celle de Windows : français pour un Windows
; en français, anglais sinon), fr ou en. Réglée aussi dans XRPerfSensors (page Interface).
; Language of the panel, the watch and the reports: auto (Windows language), fr or en.
language=auto
; Intervalle de mise à jour de l'affichage, en millisecondes
refresh_ms=250
; Durée de la fenêtre des valeurs AVG / MIN / MAX, en secondes
stats_window_s=30

[watch]
; Petite montre en plus du panneau : heure, temps de session, batterie des manettes, FPS.
; 1 = afficher la montre, 0 = non. Réglable dans XRPerfSensors (onglet Montre), avec un aperçu.
enabled=0
; Accrochée à : left_hand, right_hand ou view (en bas à droite, devant les yeux).
; Sur une main, la layer ajoute aux actions du jeu la seule position des manettes (aucun bouton) ; si le jeu
; ne déclare pas de manettes, la montre s'affiche devant les yeux. Pris en compte au lancement du jeu.
anchor=left_hand
; Sur la main : wrist_back = dos du poignet, wrist_inside = intérieur du poignet, above = au-dessus de la manette
hand_position=wrist_back
; Style : classic = aiguilles, digital = numérique, sport = chiffres et couronne des secondes
style=classic
; Éléments affichés en plus de l'heure (1 = oui, 0 = non). La batterie n'apparaît que si le runtime OpenXR
; la fournit (extension XR_EXT_interaction_profile_battery_state_display, encore rare).
session=1
battery=1
fps=1
; 1 = sur une main, la montre n'apparaît que quand on regarde son poignet
gaze_only=1
; Diamètre en mètres (0.03 à 0.20) et opacité (0.2 à 1)
size=0.06
opacity=1.00
; Ajustements de position sur la main, en mètres : le long de l'avant-bras (+ vers le coude), écart au poignet
hand_along=0.00
hand_lift=0.00

[window]
; Fenêtre du bureau affichée dans le casque (chat d'un stream, Discord...), en lecture seule. La fenêtre à
; capturer se choisit dans XRPerfSensors (onglet Fenêtre), qui fait la capture pendant les jeux VR.
; 1 = afficher, 0 = non (Ctrl+Alt+F en jeu).
enabled=0
; Emplacement : world = posée dans l'espace (Ctrl+Alt+G la pose devant soi), left_hand ou right_hand.
; Sur une main, comme pour le panneau, le suivi des manettes est mis en place au lancement du jeu.
anchor=world
; Sur la main : wrist_back, wrist_inside ou above (au-dessus de la manette, posée par son bord inférieur)
hand_position=above
; 1 = sur une main, la fenêtre n'apparaît que quand on regarde sa main
gaze_only=0
; Largeur en mètres (0.10 à 1.50) ; la hauteur suit les proportions de la fenêtre
width=0.40
; Ajustements de position sur la main, en mètres
hand_along=0.00
hand_lift=0.00
; Distance (m, 0.30 à 3.00) à laquelle Ctrl+Alt+G la pose devant soi
distance=0.80
; Pose dans l'espace, écrite par Ctrl+Alt+G (x y z en mètres, puis l'orientation). Effacez-la pour que la
; fenêtre soit reposée devant vous au prochain jeu.
;world=

[hotkeys]
; Raccourcis : Ctrl + Alt + touche. Valeur = code de touche virtuelle Windows, 0 = désactivé.
; 0x4F = O (afficher / masquer), 0x50 = P (changer d'emplacement), 0x52 = R (remise à zéro de AVG / MIN / MAX)
toggle=0x4F
position=0x50
reset=0x52
; 0x21 = Page précédente (agrandir), 0x22 = Page suivante (réduire)
size_up=0x21
size_down=0x22
; 0x24 = Début / Home (plus opaque), 0x23 = Fin / End (plus transparent)
opacity_up=0x24
opacity_down=0x23
; Fenêtre capturée : 0x46 = F (afficher / masquer), 0x47 = G (la poser devant soi)
window_toggle=0x46
window_place=0x47
; Rapports en mode manuel ([summary] mode=manual) : 0x53 = S (démarrer / arrêter l'enregistrement)
record=0x53

[framegen]
; Avec un outil de génération d'images (OFXR Bridge...), le panneau affiche deux cadences : en grand les
; images réellement rendues par le jeu, et à côté ("avec FG") celles envoyées au casque, générées comprises.
; Pour compter ces dernières, la layer ajoute un compteur tout en bas de la chaîne OpenXR, juste avant le runtime.
;   auto = seulement si un outil de génération d'images connu est chargé sous cette layer (conseillé)
;   1    = toujours, dès qu'une autre layer est chargée sous celle-ci
;   0    = jamais (la chaîne OpenXR n'est pas touchée)
measure_output=auto

[gpu]
; Temps GPU par image affiché dans le panneau, la courbe et le rapport de session.
;   0 = estimation : charge de la carte (XRPerfSensors) x durée d'une image, affichée précédée de "~".
;       Rien n'est ajouté au rendu du jeu. Compte tout le travail de la carte, pas seulement celui du jeu.
;   1 = mesure réelle : deux horodatages GPU par image (Direct3D 11 et 12 ; Vulkan et OpenGL : estimation).
;       C'est l'écart, sur le GPU, entre le début et la fin de chaque image du jeu : quand le processeur
;       est la limite, il compte aussi les moments où la carte attend. Coût négligeable.
;       Si le rendu du jeu échappe aux repères (Unreal en Direct3D 12, UEVR), la mesure est invraisemblable :
;       elle est alors écartée d'elle-même au bout de 10 secondes et l'estimation reprend.
; Pris en compte au prochain lancement du jeu. Réglable dans XRPerfSensors (page Mesures).
measure=0

[summary]
; Rapports de session : fichier texte avec FPS moyen, mini, maxi, 1 % low, temps par image, charge /
; température / fréquence CPU et GPU, VRAM, relevé minute par minute.
;   auto   = un rapport pour chaque session de jeu, du lancement à la fermeture (une session de moins de
;            15 secondes ne laisse aucun fichier)
;   manual = un rapport seulement entre deux appuis sur Ctrl+Alt+S (voir [hotkeys] record) : le premier
;            démarre l'enregistrement (témoin « REC » sur le panneau), le second l'arrête et écrit le
;            rapport (moins de 5 secondes : rien n'est écrit)
;   off    = aucun rapport (le panneau reste affiché et mesuré normalement)
; Le fichier est mis à jour toutes les 15 secondes : il existe même si le jeu plante. Changeable en cours
; de jeu depuis XRPerfSensors (page Mesures), où les rapports se consultent, s'analysent et se suppriment.
mode=auto
; Dossier des résumés. Vide = sous-dossier "sessions" à côté de la DLL.
; Exemple : folder=D:\VR\Perfs
folder=
; 1 = indiquer le modèle du processeur et de la carte graphique (celle du jeu) en tête de chaque rapport,
; 0 = ne pas les indiquer (par exemple avant de partager vos rapports). Réglable dans XRPerfSensors.
hardware=1

[openvr]
; Jeux SteamVR qui ne passent pas par OpenXR (OpenVR) : 1 = panneau, montre, rapports et fenêtre du
; bureau aussi dans ces jeux, grâce à XRPerfVR.exe (dossier sensors), lancé par XRPerfSensors. Il
; s'ajoute à SteamVR quand celui-ci est ouvert et ne le démarre jamais. Le temps GPU y est celui que
; mesure SteamVR. Les jeux OpenXR, même lancés à travers SteamVR, restent pris en charge par la layer.
; 0 = désactivé. Réglable dans XRPerfSensors (page Panneau).
enabled=1

[process]
; Exécutables dans lesquels l'overlay ne doit pas s'activer, séparés par des virgules.
; Exemple : exclude=OpenXRExplorer.exe, MonOutil.exe
exclude=
